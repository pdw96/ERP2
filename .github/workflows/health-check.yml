name: 데모 상태 확인

# 하루 4번 데모의 상태 화면을 열어 「연결됨」인지 본다. 아니면 이 작업이 실패하고,
# GitHub 가 예약 실행 실패를 메일로 알린다(받는 사람: 이 파일의 예약을 마지막으로 바꿔 머지한 계정).
# 응답 코드가 아니라 글자를 본다 — 상태 화면은 DB 가 끊겨도 200 을 돌려준다.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: 데모 /health 가 「연결됨」인가
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEMO_URL: https://erp-2-eta.vercel.app
    steps:
      - name: 상태 화면 확인
        run: |
          set -u
          code=$(curl -sS -o body.html -w '%{http_code}' --max-time 60 --retry 2 --retry-delay 20 "$DEMO_URL/health" || echo "000")
          echo "HTTP $code"
          # 실패한 날의 화면 글자를 이 실행 기록에 남긴다(GitHub 가 90일 보관).
          grep -o -E '연결됨|연결 안 됨|DB에 닿지 못했습니다|설정되지 않았습니다|커밋 [0-9a-f]{7}' body.html | sort -u || true
          if [ "$code" = "200" ] && grep -q '연결됨' body.html; then
            echo "데모 정상"
          else
            echo "::error::데모 상태 화면이 「연결됨」이 아니다 — $DEMO_URL/health 를 열고 docs/deploy.md 「확인하기」를 본다"
            exit 1
          fi
