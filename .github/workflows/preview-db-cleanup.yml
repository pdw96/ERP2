name: 미리보기 DB 가지 지우기

# PR 이 머지되거나 닫히면 그 PR 의 미리보기 DB 가지(Neon 의 preview/<가지 이름>)를 지운다(ADR 0014).
# Vercel 화면에서 이은 Neon(Vercel-Managed)은 Git 가지를 지워도 DB 가지를 지우지 않아, 무료 요금제의 10개 한도가 찬다 —
# 차면 다음 PR 의 미리보기 배포가 「Resource provisioning failed」로 시작도 못 한다.
# 열쇠는 이 Neon 프로젝트 하나로 좁힌 API 키다(docs/deploy.md 「5. 미리보기 DB 가지 지우기」).
on:
  pull_request:
    types: [closed]

# GitHub 의 토큰은 쓰지 않는다.
permissions: {}

jobs:
  delete:
    name: preview/<가지> 지우기
    # 이 레포의 가지에서 낸 PR 만 — 남의 레포(fork)에서 낸 PR 에는 미리보기 DB 가 없고, 비밀값도 오지 않는다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      # 가지 이름은 PR 을 낸 사람이 정한 글자라 스크립트에 끼워 넣지 않고 환경변수로만 넘긴다.
      BRANCH: preview/${{ github.head_ref }}
      API: https://console.neon.tech/api/v2
    steps:
      - name: Neon 의 미리보기 DB 가지를 지운다
        run: |
          set -euo pipefail
          if [ -z "${NEON_API_KEY:-}" ] || [ -z "${NEON_PROJECT_ID:-}" ]; then
            echo "::error::비밀값 NEON_API_KEY 또는 변수 NEON_PROJECT_ID 가 없다 — docs/deploy.md 「5. 미리보기 DB 가지 지우기」를 따라 넣는다"
            exit 1
          fi
          # preview/ 로 시작하는 가지만 지운다 — 데모 DB(main)는 이름이 달라 여기에 걸리지 않는다.
          case "$BRANCH" in
            preview/?*) ;;
            *) echo "::error::지울 수 없는 이름이다: $BRANCH"; exit 1 ;;
          esac

          auth=(-H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json")
          list=$(curl -fsS --max-time 30 --retry 3 -G "${auth[@]}" \
            --data-urlencode "search=$BRANCH" "$API/projects/$NEON_PROJECT_ID/branches")
          # 이름이 꼭 같고, 기본(데모) 가지가 아닌 것만.
          id=$(printf '%s' "$list" | jq -r --arg n "$BRANCH" \
            '[.branches[] | select(.name == $n and (.default | not) and (.primary | not))][0].id // empty')
          if [ -z "$id" ]; then
            echo "$BRANCH 가 없다 — 미리보기 배포가 없던 PR 이거나 이미 지웠다. 할 일 없음"
            exit 0
          fi

          code=$(curl -sS --max-time 30 --retry 3 -o /dev/null -w '%{http_code}' -X DELETE "${auth[@]}" \
            "$API/projects/$NEON_PROJECT_ID/branches/$id")
          case "$code" in
            200|202) echo "$BRANCH($id)를 지웠다" ;;
            404) echo "$BRANCH 는 그사이 지워졌다. 할 일 없음" ;;
            *) echo "::error::$BRANCH 를 지우지 못했다(HTTP $code) — Neon 콘솔 Branches 에서 손으로 지운다"; exit 1 ;;
          esac
